<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дорогоцінні Каміння - CRUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="p-8">

    <header class="mb-8 text-center">
        <h1 class="text-4xl font-bold" style="color: #000;">Коштовні Камені</h1>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-4 gap-8">
        <aside class="lg:col-span-1 p-6 h-fit" style="background-color: #ffffff; border: 2px solid #000; border-radius: 0.75rem;">
            <h2 class="text-2xl font-bold mb-4" style="color: #000;">Панель</h2>
            <button id="create-new-btn" class="btn btn-create">Create Page</button>
            
            <div class="mt-6">
                <label for="search" class="text-lg font-bold" style="color: #000;">Пошук</label>
                <input type="text" id="search-input" placeholder="Пошук за назвою..." style="margin-top: 0.5rem;">
            </div>

            <div class="mt-6">
                <label for="sort" class="text-lg font-bold" style="color: #000;">Сортувати за:</label>
                <select id="sort-select" style="margin-top: 0.5rem;">
                    <option value="">Назва</option>
                    <option value="name-asc">Назва (А-Я)</option>
                    <option value="name-desc">Назва (Я-А)</option>
                    <option value="price-desc">Ціна (макс.)</option>
                    <option value="price-asc">Ціна (мін.)</option>
                    <option value="weight-desc">Карати (більше)</option>
                    <option value="weight-asc">Карати (менше)</option>
                </select>
                <button id="apply-sort-btn" class="btn btn-sort">Порахувати загальну ціну</button>
            </div>
        </aside>

        <section class="lg:col-span-3">
            <div id="loading-indicator" style="display: none;">Завантаження...</div>
            <div id="gems-container" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"></div>
        </section>
    </main>

    <div id="gem-modal" class="modal-overlay">
        <div class="modal-content">
            <span id="modal-close-btn" class="modal-close-btn">&times;</span>
            <h2 id="modal-title" class="text-2xl font-bold mb-4" style="color: #1e293b;">Заголовок</h2>
            <form id="gem-form" novalidate>
                <input type="hidden" id="gem-id-input">
                <div><label>Назва каменю</label><input type="text" id="name-input" required minlength="2"></div>
                <div><label>Тип каменю</label><input type="text" id="type-input" required minlength="2"></div>
                <div><label>Вага (карати)</label><input type="number" id="weight-input" required min="0.01" step="0.01"></div>
                <div><label>Ціна (USD)</label><input type="number" id="price-input" required min="0"></div>
                <button type="submit" id="save-btn" class="btn btn-primary">Зберегти</button>
            </form>
        </div>
    </div>
    <div id="error-modal" class="modal-overlay"><div class="modal-content"><span id="error-close-btn" class="modal-close-btn">&times;</span><h2 class="text-2xl font-bold mb-4" style="color: #ef4444;">Помилка</h2><p id="error-message" style="color: #475569;"></p></div></div>

    <script src="/js/app.js"></script>
</body>
</html>
